# Release packaging: pushing a tag like `v0.1.1` builds the arm64 DMG on a
# macOS runner and attaches it to a GitHub Release for that tag.
#
# Usage:
#   git tag v0.1.1 && git push origin v0.1.1
#
# Free-tier note: public repos run Actions for free; private repos get
# 2000 min/month, billed at 10x on macOS runners (≈200 macOS minutes) —
# one packaging run takes ~5 minutes.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    name: Build & release DMG (arm64)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build & package DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Packaging TimingBomb $VERSION"
          TB_VERSION="$VERSION" ./scripts/make-dmg.sh

      - name: Attach DMG to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="dist/TimingBomb-${VERSION}-arm64.dmg"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$DMG" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "$DMG" \
              --title "TimingBomb $VERSION" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

  # Skill package → npm: runs on the same tag push when Skills/timingbomb
  # changed since the previous tag. Requires the NPM_TOKEN repo secret
  # (npmjs.com access token with publish rights). Bump "version" in
  # Skills/timingbomb/package.json before tagging; an already-published
  # version is skipped gracefully.
  skill-npm:
    name: Publish skill package to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did the skill package change?
        id: skill
        run: |
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV" ] && ! git diff --name-only "$PREV" "$GITHUB_REF_NAME" -- Skills/timingbomb | grep -q .; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "skill unchanged since $PREV — skipping npm publish"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.skill.outputs.changed == 'true'
        with:
          go-version-file: cli/go.mod

      - name: Build CLI binaries (all platforms)
        if: steps.skill.outputs.changed == 'true'
        run: ./scripts/build-cli.sh --all

      - name: Publish to npm
        if: steps.skill.outputs.changed == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd Skills/timingbomb
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "timingbomb@$VERSION" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "timingbomb@$VERSION already on npm — skipping"
            exit 0
          fi
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not configured — add an npmjs.com publish token to the repo secrets"
            exit 1
          fi
          # Permission check first: a valid token must resolve to an account.
          if ! WHOAMI="$(npm whoami --registry https://registry.npmjs.org/ \
              "--//registry.npmjs.org/:_authToken=$NPM_TOKEN" 2>&1)"; then
            echo "::error::NPM_TOKEN is invalid or expired: $WHOAMI"
            exit 1
          fi
          echo "npm token OK — publishing as $WHOAMI"
          npm publish --access public \
            --registry https://registry.npmjs.org/ \
            "--//registry.npmjs.org/:_authToken=$NPM_TOKEN"
